name: build

on:
  push:
  pull_request:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar SDL2 para 3DS
        # Si devkitPro no ofrece un paquete de SDL2 para 3DS, se compila SDL2
        # desde el código oficial, que soporta 3DS desde la versión 2.24.
        run: |
          dkp-pacman -Sy
          echo "Paquetes SDL disponibles:"; dkp-pacman -Slq | grep -i sdl || true
          if dkp-pacman -Si 3ds-sdl2 >/dev/null 2>&1; then
            dkp-pacman -S --noconfirm --needed 3ds-sdl2
          else
            git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git /tmp/SDL
            cmake -S /tmp/SDL -B /tmp/SDL/build \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEVKITPRO/portlibs/3ds"
            cmake --build /tmp/SDL/build -j"$(nproc)"
            cmake --install /tmp/SDL/build
          fi

      - name: Compilar
        working-directory: hello-world
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake"
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: hello_n3ds
          path: hello-world/build/*.3dsx

      # El .elf se pasa al trabajo que genera el .cia.
      - uses: actions/upload-artifact@v4
        with:
          name: hello_n3ds_elf
          path: hello-world/build/hello_n3ds.elf

  hello-world-cia:
    needs: hello-world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: hello_n3ds_elf

      - name: Instalar makerom y bannertool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools-bin dl-makerom dl-bannertool

          # Project_CTR publica makerom y ctrtool por separado: se toma el
          # release más reciente cuya etiqueta empiece por "makerom".
          tag=$(gh release list -R 3DSGuy/Project_CTR --limit 50 --json tagName --jq '.[].tagName' | grep '^makerom' | head -1)
          echo "makerom: $tag"
          gh release view "$tag" -R 3DSGuy/Project_CTR --json assets --jq '.assets[].name'
          gh release download "$tag" -R 3DSGuy/Project_CTR --pattern '*ubuntu*' --dir dl-makerom \
            || gh release download "$tag" -R 3DSGuy/Project_CTR --pattern '*linux*' --dir dl-makerom
          for z in dl-makerom/*.zip; do unzip -o "$z" -d dl-makerom; done
          find dl-makerom -type f -name makerom -exec install -m755 {} tools-bin/ \;

          # Steveice10/bannertool ya no publica releases. Se usa el fork de
          # diasurgical (DevilutionX); si no hay binario, se compila del código.
          if gh release download -R diasurgical/bannertool --pattern '*.zip' --dir dl-bannertool; then
            for z in dl-bannertool/*.zip; do unzip -o "$z" -d dl-bannertool; done
            find dl-bannertool -type f -name bannertool -path '*linux*' -path '*x86_64*' -exec install -m755 {} tools-bin/ \;
          fi
          if [ ! -x tools-bin/bannertool ]; then
            git clone --recursive --depth 1 https://github.com/Steveice10/bannertool src-bannertool
            make -C src-bannertool
            find src-bannertool/output -type f -name bannertool -exec install -m755 {} tools-bin/ \;
          fi

          ls -la tools-bin
          echo "$PWD/tools-bin" >> "$GITHUB_PATH"

      - name: Generar .cia
        run: |
          tools/3ds/make-cia.sh hello_n3ds.elf hello_n3ds.cia \
            "Hello n3ds" "Hola mundo de n3ds-ports" "AlexanderV387" \
            0xF3D50 CTR-H-N3HW \
            hello-world/assets/icon.png hello-world/assets/banner.png hello-world/assets/banner.wav

      - uses: actions/upload-artifact@v4
        with:
          name: hello_n3ds_cia
          path: hello_n3ds.cia
